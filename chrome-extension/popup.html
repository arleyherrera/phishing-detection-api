<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 18px;
    }

    .status.loading {
      background: #f3f4f6;
      color: #6b7280;
    }

    .status.safe {
      background: #dcfce7;
      color: #166534;
    }

    .status.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.error {
      background: #fef3c7;
      color: #92400e;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .url-display {
      background: #f9fafb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      word-break: break-all;
      font-size: 12px;
      color: #6b7280;
    }

    .details {
      display: none;
    }

    .details.show {
      display: block;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 500;
      color: #6b7280;
      font-size: 14px;
    }

    .detail-value {
      font-weight: 600;
      color: #111827;
      font-size: 14px;
    }

    .warning {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      color: #92400e;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #9ca3af;
    }

    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Phishing Detector</h1>
      <p>Protección en tiempo real contra phishing</p>
    </div>

    <div class="card">
      <!-- Estado de análisis -->
      <div id="status" class="status loading">
        <div class="spinner"></div>
        <div>Analizando URL...</div>
      </div>

      <!-- URL analizada -->
      <div class="url-display" id="url-display">
        Cargando...
      </div>

      <!-- Detalles -->
      <div id="details" class="details">
        <div class="detail-row">
          <span class="detail-label">Predicción:</span>
          <span class="detail-value" id="prediction">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Confianza:</span>
          <span class="detail-value" id="confidence">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Nivel de Riesgo:</span>
          <span class="detail-value" id="risk-level">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Features:</span>
          <span class="detail-value" id="features">-</span>
        </div>
      </div>

      <!-- Advertencia (si existe) -->
      <div id="warning" class="warning" style="display: none;">
      </div>

      <!-- Footer -->
      <div class="footer">
        Powered by Machine Learning (99.95% accuracy)
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
